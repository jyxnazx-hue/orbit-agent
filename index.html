<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Ambient Voice Orchestrator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-active {
      animation: pulse-ring 1.5s infinite ease-in-out;
      border-color: #10b981 !important;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col font-sans selection:bg-neutral-800">
  
  <header class="border-b border-neutral-800/80 px-8 py-5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]"></div>
      <span class="font-semibold tracking-wider text-sm uppercase text-neutral-300">Orbit Engine</span>
    </div>
    <div class="text-xs text-neutral-500 font-mono">Dynamic Dispatcher • Local Vault Active</div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-6 py-10 flex flex-col items-center">
    <!-- Mic Controller -->
    <div class="text-center mb-8">
      <button id="micBtn" type="button" class="w-20 h-20 rounded-full bg-neutral-900 border border-neutral-700 hover:border-emerald-500 flex items-center justify-center transition-all shadow-lg">
        <svg class="w-7 h-7 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
      </button>
      <p id="micStatus" class="text-xs text-neutral-500 mt-3 font-mono">Tap mic or enter thoughts</p>
    </div>

    <!-- Input Box -->
    <div class="w-full relative mb-8">
      <textarea id="promptInput" rows="3" class="w-full bg-neutral-900/60 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-neutral-600 resize-none" placeholder="e.g. Schedule HAI design review tomorrow, buy an ergonomic mouse, and remind me locker code is 4912..."></textarea>
      <button id="runBtn" type="button" class="absolute right-3 bottom-4 px-4 py-1.5 bg-neutral-100 text-neutral-950 font-medium text-xs rounded-lg hover:bg-neutral-300 transition">Route</button>
    </div>

    <!-- Human In The Loop Confirmation Intercept -->
    <div id="hitlCard" class="w-full mb-6 p-4 bg-amber-950/40 border border-amber-800/80 rounded-xl hidden">
      <div class="flex items-start space-x-3">
        <span class="text-amber-400 text-lg">⚠️</span>
        <div class="flex-1">
          <div class="text-xs font-mono text-amber-400 uppercase tracking-wider mb-1">Human-In-The-Loop Check</div>
          <p id="hitlPrompt" class="text-sm text-neutral-200 mb-3"></p>
          <div class="flex space-x-3">
            <button id="confirmBtn" type="button" class="px-3 py-1 bg-amber-500 text-neutral-950 font-medium text-xs rounded hover:bg-amber-400 transition">Confirm Action</button>
            <button id="cancelBtn" type="button" class="px-3 py-1 bg-neutral-800 text-neutral-400 text-xs rounded hover:bg-neutral-700 transition">Dismiss</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Output Section -->
    <div id="outputSection" class="w-full space-y-4 hidden">
      <div class="p-4 bg-neutral-900/40 border border-neutral-800 rounded-xl">
        <div class="text-xs font-mono text-neutral-500 uppercase tracking-wider mb-1">Orbit Supervisor</div>
        <div id="spokenResponse" class="text-sm text-neutral-300"></div>
      </div>

      <div class="space-y-2">
        <div class="text-xs font-mono text-neutral-500 uppercase tracking-wider">Dispatched System Tasks</div>
        <div id="cardsList" class="grid grid-cols-1 gap-2.5"></div>
      </div>
    </div>
  </main>

  <script>
    const micBtn = document.getElementById("micBtn");
    const micStatus = document.getElementById("micStatus");
    const promptInput = document.getElementById("promptInput");
    const runBtn = document.getElementById("runBtn");
    const outputSection = document.getElementById("outputSection");
    const spokenResponse = document.getElementById("spokenResponse");
    const cardsList = document.getElementById("cardsList");
    const hitlCard = document.getElementById("hitlCard");
    const hitlPrompt = document.getElementById("hitlPrompt");
    const confirmBtn = document.getElementById("confirmBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let pendingCategory = null;
    let pendingPayload = null;

    function speak(text) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes("Natural") || v.name.includes("Google") || v.lang === "en-US");
      if (preferred) utter.voice = preferred;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    // Web Speech API
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechAPI) {
      const rec = new SpeechAPI();
      rec.onstart = () => { micStatus.innerText = "Listening..."; micBtn.classList.add("mic-active"); };
      rec.onresult = (e) => {
        promptInput.value = e.results[0][0].transcript;
        micStatus.innerText = "Captured audio";
        micBtn.classList.remove("mic-active");
        submitQuery(false);
      };
      rec.onerror = () => { micStatus.innerText = "Mic error or denied"; micBtn.classList.remove("mic-active"); };
      rec.onend = () => { micBtn.classList.remove("mic-active"); };
      micBtn.onclick = () => { try { rec.start(); } catch(e) { rec.stop(); } };
    } else {
      micStatus.innerText = "Mic requires Chrome or Edge";
    }

    runBtn.onclick = () => submitQuery(false);

    confirmBtn.onclick = () => {
      hitlCard.classList.add("hidden");
      submitQuery(true);
    };

    cancelBtn.onclick = () => {
      hitlCard.classList.add("hidden");
      pendingCategory = null;
      pendingPayload = null;
      speak("Action cancelled.");
    };

    async function submitQuery(isConfirmed) {
      const query = promptInput.value.trim();
      if (!query) return;

      runBtn.innerText = "Routing...";
      runBtn.disabled = true;

      try {
        const payload = {
          query: query,
          confirmed: isConfirmed,
          pending_category: pendingCategory,
          pending_payload: pendingPayload
        };

        const res = await fetch("http://127.0.0.1:8000/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        speak(data.spoken_summary);

        if (data.requires_confirmation) {
          outputSection.classList.add("hidden");
          hitlCard.classList.remove("hidden");
          hitlPrompt.innerText = data.spoken_summary;
          pendingCategory = data.pending_category;
          pendingPayload = data.pending_payload;
          return;
        }

        hitlCard.classList.add("hidden");
        outputSection.classList.remove("hidden");
        spokenResponse.innerText = data.spoken_summary;
        cardsList.innerHTML = "";

        (data.actions_executed || []).forEach(act => {
          const card = document.createElement("div");
          card.className = "p-3.5 bg-neutral-900 border border-neutral-800 rounded-lg flex items-center justify-between";
          
          const details = act.input ? (act.input.detail || JSON.stringify(act.input)) : "Executed";
          const category = act.input ? (act.input.category || "Task") : "Task";
          const appName = act.input ? (act.input.app || "System") : "System";

          card.innerHTML = `
            <div>
              <span class="text-xs font-mono text-neutral-500 uppercase block">${category} ➔ ${appName}</span>
              <span class="text-sm text-neutral-200">${details}</span>
            </div>
            <span class="text-xs text-emerald-400 font-mono">Dispatched</span>
          `;
          cardsList.appendChild(card);
        });

      } catch (err) {
        alert("Failed to connect to Orbit engine at http://127.0.0.1:8000.");
      } finally {
        runBtn.innerText = "Route";
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
